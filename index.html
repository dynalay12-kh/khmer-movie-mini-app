<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Khmer Movie HD</title>
  
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- HLS.js សម្រាប់ចាក់វីដេអូ m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #0b0b0e;
      color: #ffffff;
      padding-bottom: 80px;
    }
    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      object-fit: cover;
    }
    .app-title h1 {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .app-title h1 span {
      color: #ff5e00;
    }
    .app-title p {
      font-size: 11px;
      color: #7e7e87;
    }
    .wallet-badge {
      background: #18181f;
      border: 1px solid #282832;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #ffbc00;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Search */
    .search-box {
      padding: 0 16px 14px 16px;
    }
    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-input-wrapper i {
      position: absolute;
      left: 14px;
      color: #6b6b76;
    }
    .search-input {
      width: 100%;
      background: #16161c;
      border: 1px solid #23232c;
      border-radius: 12px;
      padding: 12px 14px 12px 38px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    /* Banner */
    .banner {
      margin: 0 16px 16px 16px;
      background: linear-gradient(135deg, #2b1406, #16161c);
      border: 1px solid #3d1c08;
      border-radius: 18px;
      padding: 18px;
    }
    .banner-badge {
      display: inline-block;
      font-size: 11px;
      color: #ff7300;
      background: rgba(255, 115, 0, 0.12);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .banner h2 {
      font-size: 18px;
      margin-bottom: 4px;
    }
    .banner p {
      font-size: 12px;
      color: #9a9aa2;
      margin-bottom: 12px;
    }
    .banner-btn {
      background: linear-gradient(135deg, #ff7300, #ff3c00);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Filter Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      padding: 0 16px 16px 16px;
      overflow-x: auto;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      background: #16161c;
      border: 1px solid #23232c;
      padding: 7px 14px;
      border-radius: 10px;
      font-size: 12px;
      color: #8c8c96;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab.active {
      background: #ff5e00;
      border-color: #ff5e00;
      color: #fff;
      font-weight: 600;
    }

    /* Movies Grid */
    .section-title {
      padding: 0 16px 12px 16px;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .movies-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 16px;
    }
    .movie-card {
      background: #141419;
      border: 1px solid #202028;
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
    }
    .poster-wrapper {
      position: relative;
      width: 100%;
      padding-top: 135%;
      background: #1c1c24;
    }
    .poster-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .badge-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 6px;
    }
    .badge-free { background: #00c853; color: #000; }
    .badge-vip { background: #ffbc00; color: #000; }
    .movie-info {
      padding: 10px;
    }
    .movie-rating {
      font-size: 11px;
      color: #ffbc00;
      margin-bottom: 3px;
    }
    .movie-name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .movie-genre {
      font-size: 11px;
      color: #70707a;
    }

    /* Modal Player */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 9999;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
    }
    .modal-close {
      background: #222;
      border: none;
      color: #fff;
      font-size: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
    }
    .video-container {
      width: 100%;
      background: #000;
    }
    video {
      width: 100%;
      max-height: 240px;
      outline: none;
    }
    .episodes-area {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }
    .episodes-area h3 {
      font-size: 14px;
      margin-bottom: 12px;
    }
    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .ep-btn {
      background: #1b1b22;
      border: 1px solid #282834;
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }
    .ep-btn.active {
      background: #ff5e00;
      border-color: #ff5e00;
      font-weight: bold;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: #101014;
      border-top: 1px solid #1e1e26;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: #656570;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-item i { font-size: 16px; }
    .nav-item.active {
      color: #ff5e00;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <img src="https://i.ibb.co/N2mXtZ3Y/Chat-GPT-Image-Sep-25-2026-11-08-29-AM.png" class="app-icon" alt="Logo">
      <div class="app-title">
        <h1>KHMER MOVIE <span>HD</span></h1>
        <p>សួស្ដី, Khmer</p>
      </div>
    </div>
    <div class="wallet-badge">
      <i class="fa-solid fa-sack-dollar"></i> $0.00
    </div>
  </div>

  <!-- Search -->
  <div class="search-box">
    <div class="search-input-wrapper">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="ស្វែងរកឈ្មោះរឿង...">
    </div>
  </div>

  <!-- Banner -->
  <div class="banner">
    <span class="banner-badge">🔥 កំពុងពេញនិយម</span>
    <h2>សូមស្វាគមន៍</h2>
    <p>ទស្សនារឿងភាគល្បីៗប្រចាំថ្ងៃ</p>
    <button class="banner-btn" onclick="scrollToMovies()">ទស្សនាឥឡូវនេះ ➔</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="filterGenre('ទាំងអស់', this)">ទាំងអស់</div>
    <div class="tab" onclick="filterGenre('ពេញនិយម', this)">🔥 ពេញនិយម</div>
    <div class="tab" onclick="filterGenre('Drama', this)">🎬 Drama</div>
    <div class="tab" onclick="filterGenre('Action', this)">⚡ Action</div>
  </div>

  <!-- Section Title -->
  <div class="section-title">
    <i class="fa-solid fa-clapperboard"></i> បញ្ជីរឿងទើបអាប់ដេត
  </div>

  <!-- Movies Grid -->
  <div class="movies-grid" id="moviesContainer">
    <p style="grid-column: 1/-1; text-align: center; color: #777; padding: 20px;">កំពុងទាញយករឿង...</p>
  </div>

  <!-- Modal Player -->
  <div class="modal" id="playerModal">
    <div class="modal-header">
      <h4 id="playerTitle" style="font-size:14px; max-width:80%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">ចំណងជើងរឿង</h4>
      <button class="modal-close" onclick="closePlayer()">✕</button>
    </div>
    <div class="video-container">
      <video id="videoPlayer" controls playsinline></video>
    </div>
    <div class="episodes-area">
      <h3>ជ្រើសរើសភាគ៖</h3>
      <div class="episodes-grid" id="episodesList"></div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active"><i class="fa-solid fa-house"></i><span>ទំព័រដើម</span></div>
    <div class="nav-item"><i class="fa-solid fa-film"></i><span>រឿង</span></div>
    <div class="nav-item"><i class="fa-solid fa-wallet"></i><span>Wallet</span></div>
    <div class="nav-item"><i class="fa-solid fa-user"></i><span>គណនី</span></div>
  </div>

  <script>
    // 1. Supabase Initialization
    const SUPABASE_URL = "https://gtqnmfodfnsrejlpwrph.supabase.co";
    const SUPABASE_KEY = "sb_publishable_A1J41PnxgMv1OIN_1Gupaw_1bTNPyiz";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allMovies = [];
    let currentHls = null;

    // 2. Fetch movies from Supabase
    async function loadMovies() {
      try {
        const { data, error } = await _supabase
          .from('movies')
          .select('*')
          .order('id', { ascending: false });

        if (error) {
          console.error("Supabase Error:", error);
          return;
        }

        if (data && data.length > 0) {
          allMovies = data;
          renderMovies(allMovies);
        } else {
          document.getElementById('moviesContainer').innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #777;">មិនទាន់មានរឿងនៅឡើយទេ</p>`;
        }
      } catch (e) {
        console.error("Fetch Exception:", e);
      }
    }

    // 3. Render Movies to DOM
    function renderMovies(movies) {
      const container = document.getElementById('moviesContainer');
      container.innerHTML = "";

      movies.forEach(movie => {
        const posterUrl = movie.poster || "https://placehold.co/300x450?text=No+Poster";
        const rating = movie.rating || "9.0";
        const genre = movie.genre || "Drama";

        const card = document.createElement('div');
        card.className = "movie-card";
        card.onclick = () => openPlayer(movie);

        card.innerHTML = `
          <div class="poster-wrapper">
            <img src="${posterUrl}" class="poster-img" alt="${movie.title}" onerror="this.src='https://placehold.co/300x450?text=Poster'">
            <span class="badge-tag badge-free">FREE</span>
          </div>
          <div class="movie-info">
            <div class="movie-rating">★ ${rating}</div>
            <div class="movie-name">${movie.title}</div>
            <div class="movie-genre">${genre}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 4. Player & Episodes Logic
    function openPlayer(movie) {
      document.getElementById('playerTitle').innerText = movie.title;
      const modal = document.getElementById('playerModal');
      const epContainer = document.getElementById('episodesList');
      epContainer.innerHTML = "";

      const episodes = Array.isArray(movie.episodes) ? movie.episodes : [];

      episodes.forEach((episode, index) => {
        const btn = document.createElement('button');
        btn.className = `ep-btn ${index === 0 ? 'active' : ''}`;
        btn.innerText = `ភាគ ${episode.ep || (index + 1)}`;
        btn.onclick = () => {
          document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          playStream(episode.url);
        };
        epContainer.appendChild(btn);
      });

      modal.style.display = "flex";

      if (episodes.length > 0 && episodes[0].url) {
        playStream(episodes[0].url);
      }
    }

    function playStream(url) {
      const video = document.getElementById('videoPlayer');
      
      if (currentHls) {
        currentHls.destroy();
      }

      if (Hls.isSupported() && url.includes('.m3u8')) {
        currentHls = new Hls();
        currentHls.loadSource(url);
        currentHls.attachMedia(video);
        currentHls.on(Hls.Events.MANIFEST_PARSED, function () {
          video.play().catch(e => console.log(e));
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(e => console.log(e));
      } else {
        video.src = url;
        video.play().catch(e => console.log(e));
      }
    }

    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const video = document.getElementById('videoPlayer');
      video.pause();
      if (currentHls) {
        currentHls.destroy();
      }
      modal.style.display = "none";
    }

    // 5. Search Function
    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const filtered = allMovies.filter(m => m.title && m.title.toLowerCase().includes(query));
      renderMovies(filtered);
    });

    // 6. Filter Tabs
    function filterGenre(genre, element) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      element.classList.add('active');

      if (genre === 'ទាំងអស់') {
        renderMovies(allMovies);
      } else {
        const filtered = allMovies.filter(m => m.genre && m.genre.toLowerCase().includes(genre.toLowerCase()));
        renderMovies(filtered);
      }
    }

    function scrollToMovies() {
      document.getElementById('moviesContainer').scrollIntoView({ behavior: 'smooth' });
    }

    // Run
    loadMovies();
  </script>
</body>
</html>
