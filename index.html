<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>KHMER MOVIE HD</title>

  <!-- Google Font Khmer -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Telegram Web App SDK & HLS.js -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --primary: #ff5e00;
      --primary-glow: rgba(255, 94, 0, 0.35);
      --bg: #070709;
      --card-bg: rgba(23, 23, 28, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --text-muted: #8e8e93;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kantumruy Pro', -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overflow-x: hidden;
    }

    .app {
      max-width: 550px;
      margin: 0 auto;
      min-height: 100vh;
      padding-bottom: 95px;
    }

    /* Custom Toast Alert */
    .custom-toast {
      position: fixed;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 25, 0.95);
      border: 1px solid var(--primary);
      color: #fff;
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 13px;
      z-index: 9999999;
      box-shadow: 0 8px 25px rgba(255, 94, 0, 0.35);
      display: none;
      white-space: nowrap;
      backdrop-filter: blur(10px);
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-wrap {
      position: relative;
    }

    .logo-small {
      width: 46px;
      height: 46px;
      object-fit: cover;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .header-title {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .header-title span {
      background: linear-gradient(90deg, #ff7b00, #ff4500);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-subtitle {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 400;
      margin-top: 1px;
    }

    .balance-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #ffc837;
    }

    /* Search Box */
    .search-wrap {
      padding: 0 18px 16px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 11px 16px;
      gap: 10px;
      transition: all 0.3s;
    }

    .search-box:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 15px var(--primary-glow);
      background: rgba(255, 255, 255, 0.08);
    }

    .search-box input {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: #666;
    }

    /* Hero Banner */
    .hero {
      position: relative;
      margin: 0 18px 22px;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255, 94, 0, 0.15) 0%, rgba(10, 10, 12, 0.95) 100%), #141419;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .hero-content {
      padding: 24px 20px;
      position: relative;
      z-index: 2;
    }

    .hero-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 94, 0, 0.2);
      border: 1px solid rgba(255, 94, 0, 0.4);
      color: #ff914d;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .hero-title {
      font-size: 22px;
      font-weight: 700;
      margin-top: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .hero-meta {
      color: var(--text-muted);
      font-size: 12px;
      margin: 6px 0 16px;
    }

    .hero-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #ff7300, #ff3c00);
      color: #fff;
      border: none;
      padding: 10px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    /* Category Filter */
    .categories {
      display: flex;
      gap: 10px;
      padding: 0 18px 18px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-pill {
      flex: none;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: #a0a0a5;
      padding: 7px 15px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-pill.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
      box-shadow: 0 3px 12px var(--primary-glow);
    }

    /* Section Title */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 18px 12px;
    }

    .section-header h3 {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .see-all {
      color: #ff8533;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
    }

    /* Movie Grid */
    .movie-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      padding: 0 18px;
    }

    .movie-card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .movie-card:active {
      transform: scale(0.96);
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2/3;
      overflow: hidden;
      background: #1a1a22;
    }

    .poster-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hd-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.15);
    }

    .rating-badge {
      position: absolute;
      bottom: 6px;
      right: 6px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(6px);
      color: #ffc837;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .movie-info {
      padding: 8px;
    }

    .movie-title {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-type {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-state {
      display: none;
      grid-column: span 3;
      text-align: center;
      color: #777;
      padding: 30px 0;
      font-size: 13px;
    }

    /* Modal Player */
    #movie-detail {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #000;
      overflow-y: auto;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .modal-body {
      padding: 16px 18px 40px;
    }

    .modal-close-btn {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      border-radius: 12px;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .episodes-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 14px 0 20px;
    }

    .ep-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .ep-card.active {
      background: var(--primary);
      border-color: var(--primary);
      box-shadow: 0 2px 10px var(--primary-glow);
    }

    /* Floating Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 36px);
      max-width: 500px;
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 6px;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .nav-btn {
      border: 0;
      background: transparent;
      color: #777;
      padding: 6px 0;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .nav-btn.active {
      color: #fff;
      background: linear-gradient(135deg, rgba(255, 94, 0, 0.9), rgba(255, 60, 0, 0.9));
      box-shadow: 0 4px 12px var(--primary-glow);
    }
  </style>
</head>

<body>
  <!-- Custom Popup Toast -->
  <div id="customToast" class="custom-toast">
    <strong style="color: #ff5e00;">KHMER MOVIE HD: </strong>
    <span id="toastText"></span>
  </div>

  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo-wrap">
          <img src="IMG_3834.PNG" alt="Logo" class="logo-small" onerror="this.src='https://placehold.co/100x100/1e1e1e/fff?text=KM'">
        </div>
        <div>
          <div class="header-title">KHMER MOVIE <span>HD</span></div>
          <div class="header-subtitle">រឿងថ្មីៗ • រឿងពេញនិយម</div>
        </div>
      </div>
      <div class="balance-badge" id="user-display">
        <span>💰</span> $0.00
      </div>
    </header>

    <!-- Search Input -->
    <div class="search-wrap">
      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="ស្វែងរកឈ្មោះរឿង...">
      </div>
    </div>

    <!-- Hero Spotlight -->
    <div class="hero">
      <div class="hero-content">
        <div class="hero-tag">🔥 កំពុងពេញនិយម</div>
        <h2 class="hero-title" id="heroTitle">រឿងថ្មីៗ</h2>
        <div class="hero-meta" id="heroMeta">កំពុងទាញទិន្នន័យ...</div>
        <button class="hero-btn" id="heroBtn" onclick="playFirstMovie()">
          ទស្សនាឥឡូវនេះ ➔
        </button>
      </div>
    </div>

    <!-- Category Filter -->
    <div class="categories">
      <button class="cat-pill active">ទាំងអស់</button>
      <button class="cat-pill">🔥 ពេញនិយម</button>
      <button class="cat-pill">🆕 រឿងថ្មី</button>
      <button class="cat-pill">❤️ ចូលចិត្ត</button>
    </div>

    <!-- Section Content -->
    <div class="section-header">
      <h3>🎬 រឿងថ្មីៗ</h3>
      <a href="#" class="see-all">មើលទាំងអស់ ➔</a>
    </div>

    <!-- Movies Grid -->
    <div class="movie-grid" id="moviesContainer">
      <div class="empty-state" id="emptyState" style="display: block;">កំពុងផ្ទុកទិន្នន័យ... ⏳</div>
    </div>
  </div>

  <!-- Video Streaming Modal -->
  <div id="movie-detail">
    <div class="video-container">
      <video id="player" controls playsinline webkit-playsinline preload="metadata"></video>
    </div>

    <div class="modal-body">
      <button class="modal-close-btn" onclick="closePlayer()">✕ បិទវីដេអូ</button>
      <h2 id="modalTitle" style="font-size: 19px; font-weight: 700;"></h2>
      <div id="modalMeta" style="color: #ff914d; font-size: 12px; margin: 4px 0 16px;"></div>

      <div style="font-size: 14px; font-weight: 600;">📺 ជ្រើសរើសភាគ (Episodes)</div>
      <div class="episodes-grid" id="episodesContainer"></div>

      <button style="width: 100%; padding: 13px; border: none; border-radius: 12px; background: linear-gradient(135deg, #ff7300, #ff3c00); color: #fff; font-weight: 600; font-size: 14px; cursor: pointer;" onclick="openChannel()">
        📢 ចូលរួម Telegram Channel ផ្លូវការ
      </button>
    </div>
  </div>

  <!-- Bottom Floating Navbar -->
  <nav class="bottom-nav">
    <button class="nav-btn active">
      <span style="font-size: 16px;">🏠</span>
      <span>ទំព័រដើម</span>
    </button>
    <button class="nav-btn">
      <span style="font-size: 16px;">🎬</span>
      <span>រឿង</span>
    </button>
    <button class="nav-btn">
      <span style="font-size: 16px;">💳</span>
      <span>Wallet</span>
    </button>
    <button class="nav-btn">
      <span style="font-size: 16px;">👤</span>
      <span>គណនី</span>
    </button>
  </nav>

  <script>
    // ១. កំណត់ Supabase Configuration
    const SUPABASE_URL = "https://gtqnmfodfnsrejlpwrph.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0cW5tZm9kZm5zcmVqbHB3cnBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzU3MjUsImV4cCI6MjEwNTg1MTcyNX0.N0_JHGOF3SDR9UF-fehL8RATcFWQsCYaCtOJGnRSUWc";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let moviesData = [];
    let currentMovie = null;
    let toastTimeout = null;
    const player = document.getElementById("player");

    // មុខងារបង្ហាញ Popup ឈ្មោះ KHMER MOVIE HD
    function showAppToast(message) {
      const toast = document.getElementById("customToast");
      const toastText = document.getElementById("toastText");
      toastText.innerText = message;
      toast.style.display = "block";

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.style.display = "none";
      }, 2500);
    }

    // ២. Telegram WebApp Init
    if (window.Telegram?.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      if (tg.initDataUnsafe?.user?.first_name) {
        document.getElementById("user-display").innerHTML = `<span>👤</span> ${tg.initDataUnsafe.user.first_name}`;
      }
    }

    // ៣. ទាញទិន្នន័យរឿងចេញពី Supabase
    async function fetchMovies() {
      try {
        const { data, error } = await _supabase
          .from('movies')
          .select('*')
          .order('id', { ascending: false });

        if (error) throw error;

        if (data && data.length > 0) {
          moviesData = data;
          renderMovies(moviesData);

          const first = moviesData[0];
          document.getElementById("heroTitle").innerText = first.title;
          document.getElementById("heroMeta").innerText = `⭐ ${first.rating || '9.0'} • ${first.genre || 'Action'}`;
        } else {
          document.getElementById("emptyState").innerText = "មិនទាន់មានរឿងផុសនៅឡើយទេ 😔";
        }
      } catch (err) {
        console.error("Fetch Error:", err);
        document.getElementById("emptyState").innerText = "បរាជ័យក្នុងការទាញទិន្នន័យ សូមព្យាយាមម្ដងទៀត!";
      }
    }

    // ៤. បង្ហាញ Card រឿង
    function renderMovies(list) {
      const container = document.getElementById("moviesContainer");
      const emptyState = document.getElementById("emptyState");
      container.innerHTML = "";

      if (list.length === 0) {
        container.appendChild(emptyState);
        emptyState.style.display = "block";
        emptyState.innerText = "មិនមានរឿងដែលត្រូវនឹងការស្វែងរកទេ 😔";
        return;
      }

      list.forEach(m => {
        const card = document.createElement("div");
        card.className = "movie-card";
        card.onclick = () => openMovieDetail(m);
        card.innerHTML = `
          <div class="poster-wrap">
            <span class="hd-badge">HD</span>
            <img class="poster-img" src="${m.poster || 'IMG_3834.PNG'}" alt="${m.title}" onerror="this.src='IMG_3834.PNG'">
            <span class="rating-badge">⭐ ${m.rating || '9.0'}</span>
          </div>
          <div class="movie-info">
            <div class="movie-title">${m.title}</div>
            <div class="movie-type">${m.genre || 'Action'}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // ៥. ចាក់វីដេអូ Streaming (HLS)
    function playEpisode(index) {
      if (!currentMovie || !currentMovie.episodes || !currentMovie.episodes[index]) return;
      const epData = currentMovie.episodes[index];

      // បង្ហាញ Toast ឈ្មោះ KHMER MOVIE HD
      if (!epData.url) {
        showAppToast("ភាគ " + epData.ep + " មិនទាន់មានវីដេអូទេ!");
        return;
      }

      document.querySelectorAll(".ep-card").forEach((btn, idx) => {
        btn.classList.toggle("active", idx === index);
      });

      if (window.hlsPlayer) {
        window.hlsPlayer.destroy();
        window.hlsPlayer = null;
      }

      if (player.canPlayType("application/vnd.apple.mpegurl")) {
        player.src = epData.url;
        player.load();
        player.play().catch(e => console.log(e));
      } else if (window.Hls && Hls.isSupported()) {
        window.hlsPlayer = new Hls();
        window.hlsPlayer.loadSource(epData.url);
        window.hlsPlayer.attachMedia(player);
        window.hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => player.play().catch(e => console.log(e)));
      }
    }

    function openMovieDetail(movie) {
      currentMovie = movie;
      document.getElementById("modalTitle").innerText = movie.title;
      document.getElementById("modalMeta").innerText = `⭐ ${movie.rating || '9.0'} • ${movie.genre || 'Action'}`;

      const epContainer = document.getElementById("episodesContainer");
      epContainer.innerHTML = "";

      const episodes = Array.isArray(movie.episodes) ? movie.episodes : [];
      episodes.forEach((ep, idx) => {
        const btn = document.createElement("button");
        btn.className = "ep-card";
        btn.innerText = `ភាគ ${ep.ep}`;
        btn.onclick = () => playEpisode(idx);
        epContainer.appendChild(btn);
      });

      document.getElementById("movie-detail").style.display = "block";
      if (episodes.length > 0) playEpisode(0);
    }

    function playFirstMovie() {
      if (moviesData.length > 0) openMovieDetail(moviesData[0]);
    }

    function closePlayer() {
      if (window.hlsPlayer) {
        window.hlsPlayer.destroy();
        window.hlsPlayer = null;
      }
      player.pause();
      player.src = "";
      document.getElementById("movie-detail").style.display = "none";
    }

    // ៦. Filter ស្វែងរក
    document.getElementById("searchInput").addEventListener("input", function() {
      const val = this.value.toLowerCase().trim();
      const filtered = moviesData.filter(m => m.title.toLowerCase().includes(val));
      renderMovies(filtered);
    });

    function openChannel() {
      const link = "https://t.me/khmermoviehd88";
      if (window.Telegram?.WebApp?.openTelegramLink) {
        window.Telegram.WebApp.openTelegramLink(link);
      } else {
        window.open(link, "_blank");
      }
    }

    // ចាប់ផ្ដើម
    fetchMovies();
  </script>
