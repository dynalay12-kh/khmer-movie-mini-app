<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - បញ្ចូលរឿងច្រើនភាគ</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0e0e11; color: #fff; padding: 20px; max-width: 520px; margin: auto; }
    h2 { margin-bottom: 20px; color: #ff5e00; }
    label { font-size: 13px; color: #a0a0a5; margin-top: 14px; display: block; }
    input, textarea { width: 100%; padding: 12px; margin-top: 6px; border-radius: 10px; border: 1px solid #2a2a32; background: #18181f; color: #fff; box-sizing: border-box; font-size: 14px; }
    input:focus, textarea:focus { border-color: #ff5e00; outline: none; }
    textarea { height: 160px; font-family: monospace; font-size: 12px; resize: vertical; line-height: 1.5; }
    small { color: #ff914d; font-size: 11px; display: block; margin-top: 4px; }
    button { width: 100%; margin-top: 24px; padding: 14px; background: linear-gradient(135deg, #ff7300, #ff3c00); border: none; border-radius: 12px; color: #fff; font-weight: bold; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>

  <h2>🎬 បញ្ចូលរឿងថ្មី (Admin Panel)</h2>

  <label>ឈ្មោះរឿង *</label>
  <input type="text" id="title" placeholder="ឧ. កំពូលថាមពលចម្លែក">

  <label>ពិន្ទុ (Rating)</label>
  <input type="text" id="rating" value="9.1">

  <label>ប្រភេទរឿង (Genre)</label>
  <input type="text" id="genre" placeholder="ឧ. Action • Historical">

  <label>Link រូបភាព Poster (URL)</label>
  <input type="text" id="poster" placeholder="https://.../poster.jpg">

  <label>Link វីដេអូគ្រប់ភាគ (.m3u8) *</label>
  <textarea id="episodes_list" placeholder="ដាក់ Link វីដេអូ មួយបន្ទាត់ = មួយភាគ
https://.../ep1/playlist.m3u8
https://.../ep2/playlist.m3u8
https://.../ep3/playlist.m3u8"></textarea>
  <small>💡 ណែនាំ៖ មួយបន្ទាត់ជាតំណាងឱ្យភាគ ១, ២, ៣... រហូតដល់ភាគ ៦០។</small>

  <button onclick="uploadMovie()">🚀 ផុសរឿងចូល App ភ្លាមៗ</button>

  <script>
    const SUPABASE_URL = "https://gtqnmfodfnsrejlpwrph.supabase.co";
    const SUPABASE_KEY = "sb_publishable_A1J41PnxgMv1OIN_1Gupaw_1bTNPyiz"; 
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function uploadMovie() {
      const title = document.getElementById("title").value.trim();
      const rating = document.getElementById("rating").value.trim() || "9.0";
      const genre = document.getElementById("genre").value.trim() || "Action";
      const poster = document.getElementById("poster").value.trim();
      const rawEpisodes = document.getElementById("episodes_list").value.trim();

      if (!title || !rawEpisodes) {
        alert("សូមបំពេញឈ្មោះរឿង និង Link វីដេអូយ៉ាងហោចណាស់ ១ ភាគ!");
        return;
      }

      const lines = rawEpisodes.split("\n");
      const episodes = [];

      lines.forEach((line) => {
        const cleanUrl = line.trim();
        if (cleanUrl) {
          episodes.push({
            ep: episodes.length + 1,
            url: cleanUrl
          });
        }
      });

      if (episodes.length === 0) {
        alert("មិនមាន Link វីដេអូត្រឹមត្រូវទេ!");
        return;
      }

      const { data, error } = await _supabase
        .from('movies')
        .insert([{ title, rating, genre, poster, episodes }]);

      if (error) {
        alert("មានបញ្ហាមិនអាចផុសបាន៖ " + error.message);
      } else {
        alert(`🎉 ផុសរឿងជោគជ័យហើយ! (សរុបមាន ${episodes.length} ភាគ)`);
        location.reload();
      }
    }
  </script>
</body>
</html>
