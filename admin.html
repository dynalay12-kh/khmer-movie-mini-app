<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - បញ្ចូលរឿងថ្មី</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0e0e11; color: #fff; padding: 20px; max-width: 550px; margin: auto; }
    h2 { margin-bottom: 20px; color: #ff5e00; display: flex; align-items: center; gap: 8px; font-size: 20px; }
    label { font-size: 13px; color: #a0a0a5; margin-top: 14px; display: block; font-weight: 500; }
    input, select, textarea { width: 100%; padding: 12px; margin-top: 6px; border-radius: 10px; border: 1px solid #2a2a32; background: #18181f; color: #fff; font-size: 14px; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #ff5e00; }
    textarea { height: 110px; resize: vertical; line-height: 1.5; font-family: monospace; }
    .hint { font-size: 12px; color: #7e7e88; margin-top: 5px; }
    button { width: 100%; margin-top: 24px; padding: 14px; background: linear-gradient(135deg, #ff7300, #ff3c00); border: none; border-radius: 12px; color: #fff; font-weight: bold; cursor: pointer; font-size: 16px; transition: opacity 0.2s; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

  <h2>🎬 បញ្ចូលរឿងថ្មី (Admin Panel)</h2>

  <label>ឈ្មោះរឿង *</label>
  <input type="text" id="title" placeholder="ឧ. ម្តាយក្មេកចិត្តព្រៃ">

  <label>ពិន្ទុ (Rating)</label>
  <input type="text" id="rating" value="9.5">

  <label>ប្រភេទរឿង (Genre)</label>
  <input type="text" id="genre" placeholder="ឧ. Drama • Action">

  <label>Link រូបភាព Poster (URL) *</label>
  <input type="text" id="poster" placeholder="https://i.ibb.co/.../poster.jpg">
  <div class="hint">💡 ត្រូវប្រាកដថា Link មានកន្ទុយ .jpg, .png, ឬ .webp (អាច Upload លើ imgbb.com បាន)</div>

  <label>ប្រភេទការទស្សនា (Free / VIP) *</label>
  <select id="access_type">
    <option value="free">🎬 មើលឥតគិតថ្លៃ (Free)</option>
    <option value="vip">⭐ សម្រាប់តែ VIP</option>
  </select>

  <label>Link វីដេអូគ្រប់ភាគ (.m3u8) *</label>
  <textarea id="episodes_raw" placeholder="https://.../ep1/playlist.m3u8&#10;https://.../ep2/playlist.m3u8&#10;https://.../ep3/playlist.m3u8"></textarea>
  <div class="hint">💡 ណែនាំ៖ មួយបន្ទាត់តំណាងឱ្យភាគ ១, ២, ៣... រហូតដល់ភាគបញ្ចប់។</div>

  <button id="submitBtn" onclick="uploadMovie()">🚀 ផុសរឿងចូល App ភ្លាមៗ</button>

  <script>
    const SUPABASE_URL = "https://gtqnmfodfnsrejlpwrph.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0cW5tZm9kZm5zcmVqbHB3cnBoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNzU3MjUsImV4cCI6MjEwNTg1MTcyNX0.N0_JHGOF3SDR9UF-fehL8RATcFWQsCYaCtOJGnRSUWc";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function uploadMovie() {
      const btn = document.getElementById("submitBtn");
      const title = document.getElementById("title").value.trim();
      const rating = document.getElementById("rating").value.trim() || "9.0";
      const genre = document.getElementById("genre").value.trim() || "General";
      const poster = document.getElementById("poster").value.trim();
      const access_type = document.getElementById("access_type").value;
      const rawEpisodes = document.getElementById("episodes_raw").value.trim();

      if (!title || !rawEpisodes) {
        alert("សូមបំពេញឈ្មោះរឿង និង Link វីដេអូជាមុនសិន!");
        return;
      }

      // បម្លែង Link វីដេអូដែលចុះបន្ទាត់ ទៅជាទម្រង់ Array នៃភាគរឿង
      const lines = rawEpisodes.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      const episodes = lines.map((url, index) => ({
        ep: index + 1,
        url: url
      }));

      btn.disabled = true;
      btn.innerText = "⏳ កំពុងដំណើរការ...";

      try {
        const { data, error } = await _supabase
          .from('movies')
          .insert([{ 
            title, 
            rating, 
            genre, 
            poster, 
            access_type,
            episodes 
          }]);

        if (error) {
          alert("កំហុសក្នុងការផុស៖ " + error.message);
        } else {
          alert("🎉 ផុសរឿងបានជោគជ័យហើយ!");
          location.reload();
        }
      } catch (err) {
        alert("កំហុសបច្ចេកទេស៖ " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "🚀 ផុសរឿងចូល App ភ្លាមៗ";
      }
    }
  </script>
</body>
</html>
