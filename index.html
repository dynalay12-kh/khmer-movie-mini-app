<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KHMER MOVIE HD</title>

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- HLS.js សម្រាប់ Stream វីដេអូ m3u8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #090909;
      color: #fff;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .app {
      max-width: 650px;
      margin: auto;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-small {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 12px;
      background: #222;
    }

    .header-title {
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
    }

    .header-title span {
      color: #ff7200;
    }

    .header-subtitle {
      color: #777;
      font-size: 11px;
      margin-top: 2px;
    }

    .user-badge {
      background: #191919;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #ffb000;
    }

    /* Search */
    .search {
      margin: 4px 16px 16px;
    }

    .search input {
      width: 100%;
      background: #161616;
      border: 1px solid #2a2a2a;
      color: #fff;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 15px;
      outline: none;
    }

    .search input:focus {
      border-color: #ff7200;
    }

    /* Hero Banner */
    .hero {
      margin: 0 16px 20px;
      padding: 20px 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, #29170b, #150f0b);
      border: 1px solid #38261b;
    }

    .hero small {
      color: #ff7200;
      font-weight: 700;
      font-size: 12px;
    }

    .hero h1 {
      margin-top: 6px;
      font-size: 20px;
    }

    .hero p {
      color: #aaa;
      font-size: 13px;
      margin-top: 4px;
    }

    .hero button {
      margin-top: 14px;
      border: 0;
      background: #ff7200;
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    /* Categories */
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 16px 16px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .category {
      flex: none;
      background: #161616;
      border: 1px solid #282828;
      color: #aaa;
      padding: 7px 14px;
      border-radius: 18px;
      font-size: 13px;
      cursor: pointer;
    }

    .category.active {
      background: #ff7200;
      color: #fff;
      border-color: #ff7200;
    }

    /* Movie Grid */
    .section {
      padding: 0 16px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title h2 {
      font-size: 17px;
    }

    .movies-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .movie-card {
      background: #141414;
      border: 1px solid #242424;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }

    .movie-card:active {
      transform: scale(0.98);
    }

    .movie-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: #202020;
    }

    .movie-info {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .movie-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.25;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .movie-rating {
      color: #ffb000;
      font-size: 11px;
    }

    .movie-type {
      color: #777;
      font-size: 10px;
    }

    .empty-state {
      display: none;
      text-align: center;
      color: #777;
      padding: 40px 0;
      font-size: 14px;
    }

    /* Detail Modal */
    #movie-detail {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #090909;
      overflow-y: auto;
      padding-bottom: 40px;
    }

    .detail-container {
      max-width: 650px;
      margin: 0 auto;
    }

    .video-wrapper {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .detail-body {
      padding: 16px;
    }

    .close-btn {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 12px;
      background: #222;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .episode-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 12px 0 20px;
    }

    .ep-btn {
      background: #181818;
      border: 1px solid #2e2e2e;
      color: #fff;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .ep-btn.active {
      background: #ff7200;
      border-color: #ff7200;
    }

    .channel-btn {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #ff7200;
      color: #fff;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: min(600px, calc(100% - 24px));
      background: rgba(22, 22, 22, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid #333;
      border-radius: 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 6px;
      z-index: 100;
    }

    .nav-item {
      border: 0;
      background: transparent;
      color: #777;
      padding: 8px;
      border-radius: 14px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
    }

    .nav-item.active {
      background: #ff7200;
      color: #fff;
    }
  </style>
</head>

<body>

  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <img src="IMG_3834.PNG" alt="Logo" class="logo-small" onerror="this.src='https://placehold.co/100x100/1e1e1e/fff?text=Movie'">
        <div>
          <div class="header-title">KHMER MOVIE <span>HD</span></div>
          <div class="header-subtitle">រឿងភាគ & ភាពយន្តថ្មីៗ</div>
        </div>
      </div>
      <div class="user-badge" id="user-display">👤 សួស្តី</div>
    </header>

    <!-- Search -->
    <div class="search">
      <input type="search" id="search-input" placeholder="🔎 ស្វែងរកឈ្មោះរឿង...">
    </div>

    <!-- Hero Banner -->
    <div class="hero">
      <small>🔥 រឿងពិសេសប្រចាំសប្តាហ៍</small>
      <h1 id="hero-title">កំពូលថាមពលចម្លែក</h1>
      <p id="hero-desc">⭐ 9.1 • Action • Historical</p>
      <button onclick="playMovieById(1)">ទស្សនាឥឡូវនេះ →</button>
    </div>

    <!-- Category Tabs -->
    <div class="categories">
      <button class="category active">ទាំងអស់</button>
      <button class="category">🔥 ពេញនិយម</button>
      <button class="category">🆕 ចេញថ្មី</button>
      <button class="category">🎭 រឿងបុរាណ</button>
    </div>

    <!-- Movie List -->
    <section class="section">
      <div class="section-title">
        <h2>🎬 បញ្ជីរឿងទើបអាប់ដេត</h2>
      </div>
      <div class="movies-grid" id="movies-container"></div>
      <div class="empty-state" id="empty-state">មិនមានរឿងដែលអ្នកស្វែងរកទេ 😔</div>
    </section>
  </div>

  <!-- Detail & Player Modal -->
  <div id="movie-detail">
    <div class="detail-container">
      <div class="video-wrapper">
        <video id="player" controls playsinline webkit-playsinline preload="metadata"></video>
      </div>

      <div class="detail-body">
        <button class="close-btn" onclick="closePlayer()">✕ បិទផ្ទាំងវីដេអូ</button>
        <h2 id="detail-title" style="font-size: 20px;"></h2>
        <p id="detail-meta" style="color: #ffb000; font-size: 13px; margin: 4px 0 14px;"></p>

        <h3 style="font-size: 15px;">📺 ជ្រើសរើសភាគ</h3>
        <div class="episode-list" id="episode-container"></div>

        <button class="channel-btn" onclick="openChannel()">📢 ចូលរួម Telegram Channel ផ្លូវការ</button>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active"><span>🏠</span>ទំព័រដើម</button>
    <button class="nav-item"><span>❤️</span>ចូលចិត្ត</button>
    <button class="nav-item" onclick="openChannel()"><span>📢</span>Channel</button>
  </nav>

  <script>
    // ១. កំណត់ទិន្នន័យបញ្ជីរឿង (ងាយស្រួលបន្ថែមរឿងថ្មី ឬតំណភ្ជាប់ m3u8)
    const moviesData = [
      {
        id: 1,
        title: "កំពូលថាមពលចម្លែក",
        rating: "9.1",
        genre: "Action • Historical",
        poster: "IMG_3834.PNG",
        episodes: [
          { ep: 1, url: "https://vz-3a132f7d-c60.b-cdn.net/a203a185-73bd-4df6-ab94-231a93731de3/playlist.m3u8" },
          { ep: 2, url: "" },
          { ep: 3, url: "" },
          { ep: 4, url: "" }
        ]
      },
      {
        id: 2,
        title: "ដោះបណ្ដាសាស៊យ",
        rating: "8.8",
        genre: "Drama • Mystery",
        poster: "IMG_3834.PNG",
        episodes: [
          { ep: 1, url: "" }
        ]
      },
      {
        id: 3,
        title: "ស្នេហាជ្រៅដូចសមុទ្រ",
        rating: "8.6",
        genre: "Romance • Drama",
        poster: "IMG_3834.PNG",
        episodes: [
          { ep: 1, url: "" }
        ]
      }
    ];

    let currentMovie = null;
    let currentEpisodeIndex = 0;
    const player = document.getElementById("player");

    // ២. ចាប់ផ្តើម Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      // បង្ហាញឈ្មោះ User ប្រសិនបើមាន
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        document.getElementById("user-display").innerText = "👤 " + tg.initDataUnsafe.user.first_name;
      }
    }

    // ៣. បង្ហាញបញ្ជីរឿងលើ Screen
    function renderMovies(list) {
      const container = document.getElementById("movies-container");
      const emptyState = document.getElementById("empty-state");
      container.innerHTML = "";

      if (list.length === 0) {
        emptyState.style.display = "block";
        return;
      }
      emptyState.style.display = "none";

      list.forEach(movie => {
        const card = document.createElement("div");
        card.className = "movie-card";
        card.onclick = () => openMovieDetail(movie);
        card.innerHTML = `
          <img class="movie-poster" src="${movie.poster}" alt="${movie.title}" onerror="this.src='https://placehold.co/150x220/1e1e1e/fff?text=Poster'">
          <div class="movie-info">
            <div class="movie-title">${movie.title}</div>
            <div class="movie-rating">⭐ ${movie.rating}</div>
            <div class="movie-type">${movie.genre}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // ៤. មុខងារចាក់រឿង (HLS Streaming)
    function playEpisode(index) {
      if (!currentMovie || !currentMovie.episodes[index]) return;

      const epData = currentMovie.episodes[index];
      if (!epData.url) {
        alert("ភាគ " + epData.ep + " មិនទាន់មានវីដេអូនៅឡើយទេ!");
        return;
      }

      currentEpisodeIndex = index;

      // ធ្វើបច្ចុប្បន្នភាពប៊ូតុង Active លើភាគ
      document.querySelectorAll(".ep-btn").forEach((btn, idx) => {
        btn.classList.toggle("active", idx === index);
      });

      // បិទ HLS Instance ចាស់
      if (window.hlsPlayer) {
        window.hlsPlayer.destroy();
        window.hlsPlayer = null;
      }

      // iOS Safari (គាំទ្រ HLS ធម្មជាតិ)
      if (player.canPlayType("application/vnd.apple.mpegurl")) {
        player.src = epData.url;
        player.load();
        player.play().catch(e => console.log("Play failed:", e));
      } 
      // Android/Chrome (ប្រើ Hls.js)
      else if (window.Hls && Hls.isSupported()) {
        window.hlsPlayer = new Hls();
        window.hlsPlayer.loadSource(epData.url);
        window.hlsPlayer.attachMedia(player);
        window.hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function () {
          player.play().catch(e => console.log("Play failed:", e));
        });
      }
    }

    // ៥. បើកផ្ទាំង Player
    function openMovieDetail(movie) {
      currentMovie = movie;
      document.getElementById("detail-title").innerText = movie.title;
      document.getElementById("detail-meta").innerText = `⭐ ${movie.rating} • 🎭 ${movie.genre}`;

      // បង្កើតប៊ូតុងភាគ
      const epContainer = document.getElementById("episode-container");
      epContainer.innerHTML = "";
      movie.episodes.forEach((ep, index) => {
        const btn = document.createElement("button");
        btn.className = "ep-btn";
        btn.innerText = `ភាគ ${ep.ep}`;
        btn.onclick = () => playEpisode(index);
        epContainer.appendChild(btn);
      });

      document.getElementById("movie-detail").style.display = "block";
      playEpisode(0); // ចាក់ភាគ ១ ភ្លាម
    }

    function playMovieById(id) {
      const movie = moviesData.find(m => m.id === id);
      if (movie) openMovieDetail(movie);
    }

    function closePlayer() {
      if (window.hlsPlayer) {
        window.hlsPlayer.destroy();
        window.hlsPlayer = null;
      }
      player.pause();
      player.src = "";
      document.getElementById("movie-detail").style.display = "none";
    }

    // ស្វ័យប្រវត្តចាក់ភាគបន្ទាប់ពេលចប់
    player.onended = function () {
      if (currentMovie && currentEpisodeIndex + 1 < currentMovie.episodes.length) {
        playEpisode(currentEpisodeIndex + 1);
      }
    };

    // ៦. ស្វែងរកឈ្មោះរឿង
    document.getElementById("search-input").addEventListener("input", function () {
      const keyword = this.value.toLowerCase().trim();
      const filtered = moviesData.filter(m => m.title.toLowerCase().includes(keyword));
      renderMovies(filtered);
    });

    // ៧. Link ទៅកាន់ Channel
    function openChannel() {
      const link = "https://t.me/khmermoviehd88";
      if (window.Telegram?.WebApp?.openTelegramLink) {
        window.Telegram.WebApp.openTelegramLink(link);
      } else {
        window.open(link, "_blank");
      }
    }

    // Load ទិន្នន័យលើកដំបូង
    renderMovies(moviesData);
  </script>
</body>
</html>
