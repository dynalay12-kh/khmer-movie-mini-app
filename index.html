<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHMER MOVIE HD</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#090909;
  color:#fff;
}

.app{
  max-width:700px;
  margin:auto;
  min-height:100vh;
  padding-bottom:90px;
}

.header{
  padding:20px 18px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:21px;
  font-weight:800;
}

.balance{
  background:#191919;
  border:1px solid #333;
  border-radius:20px;
  padding:9px 14px;
  font-size:14px;
}

.search{
  margin:8px 18px 18px;
}

.search input{
  width:100%;
  background:#171717;
  border:1px solid #333;
  color:white;
  padding:15px 18px;
  border-radius:17px;
  font-size:16px;
  outline:none;
}

.hero{
  margin:0 18px 25px;
  padding:25px 20px;
  border-radius:24px;
  background:linear-gradient(135deg,#29170b,#17100c);
  border:1px solid #38261b;
}

.hero small{
  color:#aaa;
}

.hero h1{
  margin-top:8px;
  font-size:25px;
}

.hero p{
  color:#bbb;
  margin-top:8px;
}

.hero button{
  margin-top:18px;
  border:0;
  background:#ff7200;
  color:#fff;
  padding:12px 20px;
  border-radius:13px;
  font-weight:700;
  font-size:15px;
}

.section{
  padding:0 18px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.section-title h2{
  font-size:19px;
}

.section-title span{
  color:#ff7200;
  font-size:13px;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:15px;
}

.category{
  flex:none;
  background:#191919;
  border:1px solid #333;
  color:#ccc;
  padding:8px 13px;
  border-radius:20px;
}

.category.active{
  background:#ff7200;
  color:#fff;
  border-color:#ff7200;
}

.movies{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.card{
  background:#151515;
  border:1px solid #292929;
  border-radius:15px;
  overflow:hidden;
}
.movie-poster{
  width:100%;
  aspect-ratio:2/3;
  object-fit:cover;
  display:block;
}
.poster{
  aspect-ratio:2/3;
  background:
    linear-gradient(135deg,#3a2518,#161616);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
}

.info{
  padding:9px;
}

.title{
  font-size:14px;
  font-weight:700;
  line-height:1.3;
}

.rating{
  color:#ffb000;
  font-size:12px;
  margin-top:5px;
}

.type{
  color:#888;
  font-size:11px;
  margin-top:3px;
}

.bottom{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(660px,calc(100% - 24px));
  background:#191919;
  border:1px solid #383838;
  border-radius:22px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:7px;
  z-index:20;
}

.nav{
  border:0;
  background:transparent;
  color:#888;
  padding:9px 4px;
  border-radius:15px;
  font-size:12px;
}

.nav.active{
  background:#ff7200;
  color:white;
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:2px;
}

.empty{
  display:none;
  text-align:center;
  color:#888;
  padding:35px;
}
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px;
  gap:12px;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.logo-small{
  width:52px;
  height:52px;
  object-fit:cover;
  border-radius:12px;
  flex-shrink:0;
}

.header-text{
  min-width:0;
}

.header-title{
  font-size:19px;
  font-weight:800;
  color:#fff;
  white-space:nowrap;
}

.header-title span{
  color:#ff7200;
}

.header-subtitle{
  color:#777;
  font-size:12px;
  margin-top:3px;
  white-space:nowrap;
}

.balance{
  flex-shrink:0;
  background:#191919;
  border:1px solid #333;
  border-radius:25px;
  padding:10px 15px;
  font-size:14px;
  font-weight:600;
  white-space:nowrap;
}

@media(max-width:420px){
  .header{
    padding:12px 16px;
  }

  .logo-small{
    width:48px;
    height:48px;
  }

  .header-title{
    font-size:16px;
  }

  .header-subtitle{
    font-size:10px;
  }

  .balance{
    padding:9px 12px;
    font-size:13px;
  }
.detail-poster{
  width:150px !important;
  height:225px !important;
  max-width:150px !important;
  object-fit:cover;
  display:block;
  margin:10px auto 18px;
  border-radius:14px;
}

</style>
</head>

<body>
<div class="app">

  <header class="header">

  <div class="header-left">

    <img
      src="IMG_3834.PNG"
      alt="KHMER MOVIE HD"
      class="logo-small"
    >

    <div class="header-text">
      <div class="header-title">
        KHMER MOVIE
        <span>HD</span>
      </div>

      <div class="header-subtitle">
        រឿងថ្មីៗ • រឿងពេញនិយម
      </div>
    </div>

  </div>

  <div class="balance">
    💰 $0.00
  </div>

</header>

  <div class="search">
    <input
      id="search"
      type="search"
      placeholder="🔎 ស្វែងរកឈ្មោះរឿង..."
    >
  </div>

  <section class="hero">
    <small>🔥 កំពុងពេញនិយម</small>
    <h1>រឿងថ្មីប្រចាំសប្តាហ៍</h1>
    <p>⭐ 9.1 • Historical • Action</p>
    <button onclick="openMovie()">
      មើលរឿង →
    </button>
  </section>

  <section class="section">

    <div class="categories">
      <button class="category active">ទាំងអស់</button>
      <button class="category">🔥 ពេញនិយម</button>
      <button class="category">🆕 រឿងថ្មី</button>
      <button class="category">❤️ ចូលចិត្ត</button>
    </div>

    <div class="section-title">
      <h2>🎬 រឿងថ្មីៗ</h2>
      <span>មើលទាំងអស់ →</span>
    </div>

    <div id="movies" class="movies">
<div class="card" data-title="កំពូលថាមពលចម្លែក"
     onclick="openMovieDetail('កំពូលថាមពលចម្លែក','9.1','Action • Historical')">

  <img class="movie-poster" src="IMG_3834.PNG" alt="កំពូលថាមពលចម្លែក">

  <div class="info">
    <div class="title">កំពូលថាមពលចម្លែក</div>
    <div class="rating">⭐ 9.1</div>
    <div class="type">Action • Historical</div>
  </div>

</div>

<div class="card" data-title="ដោះបណ្ដាសាស៊យ"
     onclick="openMovieDetail('ដោះបណ្ដាសាស៊យ','8.8','Drama')">
  <img class="movie-poster" src="IMG_3834.PNG" alt="ដោះបណ្ដាសាស៊យ">
  <div class="info">
    <div class="title">ដោះបណ្ដាសាស៊យ</div>
    <div class="rating">⭐ 8.8</div>
    <div class="type">Drama</div>
  </div>
</div>

<div class="card" data-title="ស្នេហាជ្រៅដូចសមុទ្រ"
     onclick="openMovieDetail('ស្នេហាជ្រៅដូចសមុទ្រ','8.6','Romance')">
  <img class="movie-poster" src="IMG_3834.PNG" alt="ស្នេហាជ្រៅដូចសមុទ្រ">
  <div class="info">
    <div class="title">ស្នេហាជ្រៅដូចសមុទ្រ</div>
    <div class="rating">⭐ 8.6</div>
    <div class="type">Romance</div>
  </div>
</div>
    <div id="empty" class="empty">
      មិនមានរឿងដែលរកឃើញទេ 😔
    </div>

  </section>

</div>

<nav class="bottom">
  <button class="nav active">
    <span class="nav-icon">🏠</span>
    ទំព័រដើម
  </button>

  <button class="nav">
    <span class="nav-icon">🎬</span>
    រឿង
  </button>

  <button class="nav">
    <span class="nav-icon">💳</span>
    Wallet
  </button>

  <button class="nav">
    <span class="nav-icon">👤</span>
    គណនី
  </button>
</nav>

<script>

const search = document.getElementById("search");
const cards = document.querySelectorAll(".card");
const empty = document.getElementById("empty");

search.addEventListener("input", function(){

  const keyword = this.value.toLowerCase().trim();
  let found = 0;

  cards.forEach(card => {

    const title =
      card.dataset.title.toLowerCase();

    if(title.includes(keyword)){
      card.style.display = "";
      found++;
    }else{
      card.style.display = "none";
    }

  });

  empty.style.display =
    found === 0 ? "block" : "none";

});

function openMovie(){

  openMovieDetail(
    "រឿងថ្មីប្រចាំសប្តាហ៍",
    "9.1",
    "Action • Historical"
  );

}

function openMovieDetail(title, rating, type){

  const oldDetail =
    document.getElementById("movie-detail");

  if(oldDetail){
    oldDetail.remove();
  }

  const detail =
    document.createElement("div");

  detail.id = "movie-detail";

  detail.innerHTML = `
    <div class="detail-box">

      <button
        class="detail-close"
        onclick="closeMovieDetail()">
        ✕
      </button>

      <img
        src="IMG_3834.PNG"
        class="detail-poster"
        alt="${title}"
      >

      <div class="detail-content">

        <div class="detail-label">
          🔥 កំពុងពេញនិយម
        </div>

        <h1>${title}</h1>

        <div class="detail-rating">
          ⭐ ${rating}
        </div>

        <div class="detail-type">
          🎭 ${type}
        </div>

        <p class="detail-description">
          រឿងថ្មីៗ និងរឿងពេញនិយម
          ពី KHMER MOVIE HD។
        </p>

        <button
          class="watch-button"
          onclick="watchMovie('${title}')">
          ▶️ មើលរឿង
        </button>

        <button
  class="channel-button"
  onclick="window.open('https://t.me/khmermoviehd88','_blank')">
  📢 ចូល Channel
</button>

      </div>

    </div>
  `;

  document.body.appendChild(detail);

}

function closeMovieDetail(){

  const detail =
    document.getElementById("movie-detail");

  if(detail){
    detail.remove();
  }

}

function watchMovie(title){

  window.open(
    "https://t.me/Khm​​ermoviehdbot",
    "_blank"
  );

}
</script>

</body>
</html>
